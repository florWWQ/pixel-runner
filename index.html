<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Pixel Runner</title>
<style>
  :root{
    --ink:#111111;
    --paper:#ffffff;
    --sky-top:#eef3f7;
    --sky-bot:#ffffff;
    --accent:#2b6cb0;
    --gold:#c9971f;
    --danger:#c0392b;
    --panel:#111111;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;width:100%;height:100%;
    background:#000;
    overflow:hidden;
    font-family:'PixelFont', monospace;
    -webkit-tap-highlight-color: transparent;
    user-select:none;
    touch-action: manipulation;
  }
  @font-face{
    font-family:'PixelFont';
    src: local('Courier New');
  }
  #wrap{
    position:relative;
    width:100%;height:100%;
    max-width:900px;
    margin:0 auto;
    background:linear-gradient(to bottom, var(--sky-top) 0%, var(--sky-bot) 70%);
    overflow:hidden;
  }
  canvas{
    display:block;
    width:100%;height:100%;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
  }
  .overlay{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:16px;
    background:rgba(255,255,255,0.94);
    padding:24px;
    text-align:center;
  }
  .hidden{display:none !important;}
  h1{
    font-size:clamp(22px,6vw,34px);
    margin:0 0 4px 0;
    letter-spacing:2px;
    color:var(--ink);
    text-transform:uppercase;
    border:3px solid var(--ink);
    padding:10px 18px;
    background:#fff;
    box-shadow:6px 6px 0 var(--ink);
  }
  .sub{font-size:12px;color:#555;letter-spacing:1px;}
  .btn{
    font-family:inherit;
    font-size:14px;
    letter-spacing:1px;
    text-transform:uppercase;
    padding:12px 26px;
    background:var(--ink);
    color:#fff;
    border:3px solid var(--ink);
    box-shadow:4px 4px 0 rgba(0,0,0,0.25);
    cursor:pointer;
    min-width:180px;
  }
  .btn:active{ transform:translate(2px,2px); box-shadow:2px 2px 0 rgba(0,0,0,0.25);}
  .btn.secondary{ background:#fff; color:var(--ink); }
  .btn.gold{ background:var(--gold); border-color:var(--gold); color:#111;}
  .btn:disabled{ opacity:0.4; cursor:default; }
  .idlechar{
    width:96px;height:auto;
    image-rendering:pixelated;
    animation: breathe 1.6s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{ transform: scaleY(1) translateY(0); }
    50%{ transform: scaleY(1.045) translateY(-2px); }
  }
  .hud{
    position:absolute; top:0; left:0; right:0;
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:10px 14px;
    font-size:14px;
    color:var(--ink);
    pointer-events:none;
    text-shadow: 0 0 4px #fff, 0 0 4px #fff, 0 0 4px #fff;
  }
  .hud .pill{
    background:#fff;
    border:2px solid var(--ink);
    padding:4px 10px;
    box-shadow:2px 2px 0 var(--ink);
    pointer-events:auto;
  }
  .coinIcon{ width:14px; height:14px; vertical-align:-2px; margin-right:4px; image-rendering:pixelated; object-fit:contain; }
  #shopGrid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(74px,1fr));
    gap:10px;
    width:100%;
    max-width:640px;
    max-height:46vh;
    overflow-y:auto;
    padding:10px;
    border:3px solid var(--ink);
    background:#fff;
  }
  .skinCard{
    display:flex; flex-direction:column; align-items:center; gap:4px;
    padding:6px 4px;
    border:2px solid #ccc;
    background:#fafafa;
    cursor:pointer;
    position:relative;
  }
  .skinCard.owned{ border-color:var(--accent); }
  .skinCard.equipped{ border-color:var(--gold); background:#fff8e6; }
  .skinCard img{ width:44px; image-rendering:pixelated; }
  .skinCard .price{ font-size:10px; color:#555; }
  .skinCard .lock{
    position:absolute; top:2px; right:2px; font-size:10px; color:#c0392b;
  }
  .topbar{
    display:flex; justify-content:space-between; align-items:center;
    width:100%; max-width:640px; margin-bottom:4px;
  }
  .rowbtns{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  .go-stats{
    display:flex; gap:18px; margin:6px 0 10px 0;
  }
  .go-stats div{ font-size:13px; }
  .go-stats b{ display:block; font-size:20px; }
  .tapHint{
    position:absolute; bottom:14px; left:0; right:0;
    text-align:center; font-size:11px; color:#333;
    opacity:0.8; pointer-events:none;
    text-shadow: 0 0 4px #fff, 0 0 4px #fff;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <div class="hud hidden" id="hud">
    <div class="pill" id="scorePill">0 очков</div>
    <div class="pill" id="coinPill"><img class="coinIcon" id="coinIconHud"/> 0</div>
  </div>
  <div class="tapHint hidden" id="tapHint">Нажмите / коснитесь экрана, чтобы прыгнуть</div>

  <div class="overlay" id="menuScreen">
    <h1>PIXEL RUNNER</h1>
    <img class="idlechar" id="menuCharImg" src="" alt="">
    <div class="sub">Беги, собирай монеты, уклоняйся от препятствий</div>
    <div class="rowbtns">
      <button class="btn" id="playBtn">Играть</button>
      <button class="btn secondary" id="shopBtnMenu">Магазин</button>
    </div>
    <div class="sub" id="bestScoreLine">Лучший результат: 0</div>
  </div>

  <div class="overlay hidden" id="shopScreen">
    <div class="topbar">
      <h1 style="font-size:18px;box-shadow:4px 4px 0 var(--ink);">МАГАЗИН</h1>
      <div class="pill" style="box-shadow:2px 2px 0 var(--ink);"><img class="coinIcon" id="coinIconShop"/><span id="shopCoins">0</span></div>
    </div>
    <div id="shopGrid"></div>
    <button class="btn secondary" id="backFromShop">Назад</button>
  </div>

  <div class="overlay hidden" id="gameoverScreen">
    <h1 style="color:var(--danger);border-color:var(--danger);box-shadow:6px 6px 0 var(--danger);">ИГРА ОКОНЧЕНА</h1>
    <div class="go-stats">
      <div>Очки<b id="goScore">0</b></div>
      <div>Монеты<b id="goCoins">0</b></div>
      <div>Рекорд<b id="goBest">0</b></div>
    </div>
    <div class="rowbtns">
      <button class="btn gold" id="restartBtn">Ещё раз</button>
      <button class="btn secondary" id="shopBtnGO">Магазин</button>
      <button class="btn secondary" id="menuBtnGO">Меню</button>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

/* ---------- Load manifest & build image objects ---------- */
const MANIFEST = JSON.parse(document.getElementById('manifestData').textContent);

function imgFromB64(b64){
  const im = new Image();
  im.src = "data:image/png;base64," + b64;
  return im;
}

const SKINS = MANIFEST.skins.map((s,i)=>({
  id:s.id,
  index:i,
  name: i===0 ? "Обычный" : ("Скин " + i),
  price: i===0 ? 0 : (1000 + (i-1)*250),
  front: imgFromB64(s.front),
  walk: imgFromB64(s.walk)
}));
const OBST_IMGS = MANIFEST.obstacles.map(imgFromB64);
const GROUND_IMG = imgFromB64(MANIFEST.ground);
const COIN_IMG = imgFromB64(MANIFEST.coin);

/* ---------- Persistence ---------- */
const SAVE_KEY = "pixelRunnerSave_v1";
function loadSave(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(raw){
      const d = JSON.parse(raw);
      if(!d.owned || !d.owned.length) d.owned=[SKINS[0].id];
      if(!d.equipped) d.equipped = SKINS[0].id;
      if(typeof d.coins!=="number") d.coins=0;
      if(typeof d.best!=="number") d.best=0;
      return d;
    }
  }catch(e){}
  return { coins:0, best:0, owned:[SKINS[0].id], equipped:SKINS[0].id };
}
let save = loadSave();
function persist(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){}
}

/* ---------- DOM refs ---------- */
const wrap = document.getElementById('wrap');
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

const hud = document.getElementById('hud');
const scorePill = document.getElementById('scorePill');
const coinPill = document.getElementById('coinPill');
const tapHint = document.getElementById('tapHint');

const menuScreen = document.getElementById('menuScreen');
const shopScreen = document.getElementById('shopScreen');
const gameoverScreen = document.getElementById('gameoverScreen');

const menuCharImg = document.getElementById('menuCharImg');
const bestScoreLine = document.getElementById('bestScoreLine');

const shopGrid = document.getElementById('shopGrid');
const shopCoinsEl = document.getElementById('shopCoins');

const goScore = document.getElementById('goScore');
const goCoins = document.getElementById('goCoins');
const goBest = document.getElementById('goBest');

document.getElementById('coinIconHud').src = COIN_IMG.src;
document.getElementById('coinIconShop').src = COIN_IMG.src;

/* ---------- Canvas sizing ---------- */
let CW=0, CH=0, DPR=1;
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  const rect = wrap.getBoundingClientRect();
  CW = rect.width; CH = rect.height;
  canvas.width = Math.floor(CW*DPR);
  canvas.height = Math.floor(CH*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize);
resize();

/* ---------- Game constants ---------- */
const GROUND_H_RATIO = 0.18;
const PIXELS_PER_METER = 45;
let groundY = 0;

function computeGround(){ groundY = CH * (1-GROUND_H_RATIO); }
computeGround();

/* ---------- Game state ---------- */
let state = "menu"; // menu | playing | shop | gameover
let equippedSkin = SKINS.find(s=>s.id===save.equipped) || SKINS[0];

function refreshMenuChar(){
  menuCharImg.src = equippedSkin.front.src;
  bestScoreLine.textContent = "Лучший результат: " + save.best;
}
refreshMenuChar();

/* ---------- Player ---------- */
const player = {
  x: 0, y:0, w:44, h:68,
  vy:0,
  onGround:true,
  jumping:false,
  bob:0
};
const GRAVITY = 2400;
const JUMP_V = -680;

function resetPlayer(){
  player.w = 44; player.h = 68;
  player.x = CW*0.16;
  player.y = groundY - player.h;
  player.vy = 0;
  player.onGround = true;
  player.jumping = false;
}

/* ---------- World ---------- */
let scrollX = 0;
let speed = 210; // px/s
const BASE_SPEED = 210;
let distanceMeters = 0;
let score = 0;
let runCoins = 0;
let obstacles = [];
let coins = [];
let nextObstacleAt = 0;
let nextCoinAt = 0;
let elapsed = 0;
let gameOverTriggered = false;

function rand(a,b){ return a + Math.random()*(b-a); }

function spawnObstacle(){
  const imgIndex = Math.floor(rand(0,OBST_IMGS.length));
  const img = OBST_IMGS[imgIndex];
  const targetH = rand(46,64);
  const scale = targetH / img.height;
  const w = img.width*scale, h = img.height*scale;
  obstacles.push({
    x: CW + 40,
    w, h,
    img,
    y: groundY - h
  });
}

function spawnCoinRow(){
  const count = Math.floor(rand(1,3));
  const gap = 34;
  const startX = CW + 60;
  const floatY = Math.random()<0.5 ? groundY-40 : groundY-110;
  for(let i=0;i<count;i++){
    coins.push({
      x: startX + i*gap,
      y: floatY + Math.sin(i*0.8)*6,
      r: 12,
      collected:false,
      phase: Math.random()*Math.PI*2
    });
  }
}

function scheduleNextObstacle(){
  const minGap = 260 + speed*0.35;
  nextObstacleAt = scrollX + rand(minGap, minGap+260);
}
function scheduleNextCoin(){
  nextCoinAt = scrollX + rand(420,820);
}

function startRun(){
  scrollX = 0; speed = BASE_SPEED; distanceMeters=0; score=0; runCoins=0;
  obstacles = []; coins = []; elapsed=0; gameOverTriggered=false;
  resetPlayer();
  scheduleNextObstacle();
  scheduleNextCoin();
  state = "playing";
  showOnly(null);
  hud.classList.remove('hidden');
  tapHint.classList.remove('hidden');
  updateHud();
}

function padScore(n){ return String(Math.max(0,Math.floor(n))).padStart(5,'0'); }
function updateHud(){
  scorePill.textContent = padScore(score);
  coinPill.querySelector('span') ? null : null;
  coinPill.childNodes[coinPill.childNodes.length-1].textContent = " " + runCoins;
}

/* ---------- Screens ---------- */
function showOnly(id){
  [menuScreen, shopScreen, gameoverScreen].forEach(el=>{
    if(el.id===id) el.classList.remove('hidden');
    else el.classList.add('hidden');
  });
  if(id!==null){ hud.classList.add('hidden'); tapHint.classList.add('hidden'); }
}

function goToMenu(){
  state="menu";
  refreshMenuChar();
  showOnly('menuScreen');
}

function goToShop(){
  state="shop";
  renderShop();
  showOnly('shopScreen');
}

function renderShop(){
  shopCoinsEl.textContent = save.coins;
  shopGrid.innerHTML = "";
  SKINS.forEach(skin=>{
    const owned = save.owned.includes(skin.id);
    const equipped = save.equipped === skin.id;
    const card = document.createElement('div');
    card.className = "skinCard" + (owned?" owned":"") + (equipped?" equipped":"");
    const img = document.createElement('img');
    img.src = skin.front.src;
    card.appendChild(img);
    const label = document.createElement('div');
    label.className="price";
    if(equipped){ label.textContent = "Надето"; }
    else if(owned){ label.textContent = "Выбрать"; }
    else { label.innerHTML = '<img class="coinIcon" src="'+COIN_IMG.src+'">' + skin.price; }
    card.appendChild(label);
    if(!owned){
      const lock = document.createElement('div');
      lock.className="lock";
      lock.textContent="🔒";
      card.appendChild(lock);
    }
    card.addEventListener('click', ()=>{
      if(owned){
        save.equipped = skin.id;
        equippedSkin = skin;
        persist();
        renderShop();
        refreshMenuChar();
      } else if(save.coins >= skin.price){
        save.coins -= skin.price;
        save.owned.push(skin.id);
        save.equipped = skin.id;
        equippedSkin = skin;
        persist();
        renderShop();
        refreshMenuChar();
      }
    });
    shopGrid.appendChild(card);
  });
}

function goToGameOver(){
  state="gameover";
  save.coins += runCoins;
  if(score > save.best) save.best = score;
  persist();
  goScore.textContent = score;
  goCoins.textContent = runCoins;
  goBest.textContent = save.best;
  showOnly('gameoverScreen');
}

/* ---------- Input ---------- */
function tryJump(){
  if(state!=="playing") return;
  if(player.onGround && !player.jumping){
    player.vy = JUMP_V;
    player.onGround=false;
    player.jumping=true;
  }
}
window.addEventListener('keydown', (e)=>{
  if(e.code==="Space"||e.code==="ArrowUp"){ e.preventDefault(); tryJump(); }
});
canvas.addEventListener('pointerdown', tryJump);
wrap.addEventListener('pointerdown', (e)=>{
  if(state==="playing") tryJump();
});

document.getElementById('playBtn').addEventListener('click', startRun);
document.getElementById('shopBtnMenu').addEventListener('click', goToShop);
document.getElementById('backFromShop').addEventListener('click', ()=>{
  if(state==="shop") goToMenu();
});
document.getElementById('restartBtn').addEventListener('click', startRun);
document.getElementById('shopBtnGO').addEventListener('click', goToShop);
document.getElementById('menuBtnGO').addEventListener('click', goToMenu);

/* ---------- Collision ---------- */
function rectsOverlap(ax,ay,aw,ah,bx,by,bw,bh){
  return ax < bx+bw && ax+aw > bx && ay < by+bh && ay+ah > by;
}

/* ---------- Main loop ---------- */
let lastT = performance.now();
function frame(t){
  const dt = Math.min((t-lastT)/1000, 0.033);
  lastT = t;
  computeGround();

  if(state==="playing"){
    elapsed += dt;
    scrollX += speed*dt;
    distanceMeters = scrollX / PIXELS_PER_METER;
    score = Math.floor(distanceMeters);

    // physics
    player.vy += GRAVITY*dt;
    player.y += player.vy*dt;
    const groundLevelY = groundY - player.h;
    if(player.y >= groundLevelY){
      player.y = groundLevelY;
      player.vy = 0;
      player.onGround = true;
      player.jumping = false;
    }
    player.bob += dt* (speed/40);

    // spawn
    if(scrollX >= nextObstacleAt){ spawnObstacle(); scheduleNextObstacle(); }
    if(scrollX >= nextCoinAt){ spawnCoinRow(); scheduleNextCoin(); }

    // move obstacles / coins
    for(const o of obstacles) o.x -= speed*dt;
    obstacles = obstacles.filter(o=>o.x + o.w > -20);
    for(const c of coins) c.x -= speed*dt;
    coins = coins.filter(c=> c.x > -30 && !c.collected);

    // collisions with obstacles (slightly inset hitbox)
    for(const o of obstacles){
      const padX = player.w*0.20, padTop = player.h*0.10, padBottom = player.h*0.04;
      const oPadX = o.w*0.26, oPadTop = o.h*0.18;
      if(rectsOverlap(player.x+padX, player.y+padTop, player.w-2*padX, player.h-padTop-padBottom,
                       o.x+oPadX, o.y+oPadTop, o.w-2*oPadX, o.h-oPadTop)){
        if(!gameOverTriggered){ gameOverTriggered=true; goToGameOver(); }
      }
    }
    // collect coins
    for(const c of coins){
      if(c.collected) continue;
      const dx = (player.x+player.w/2) - c.x;
      const dy = (player.y+player.h/2) - c.y;
      if(Math.sqrt(dx*dx+dy*dy) < 40){
        c.collected = true;
        runCoins += 1;
      }
    }

    updateHud();
  }

  render();
  requestAnimationFrame(frame);
}

/* ---------- Rendering ---------- */
function drawGround(){
  const gh = CH - groundY;
  const tileW = GROUND_IMG.width * (gh/GROUND_IMG.height) || 80;
  const scaleH = gh;
  const scaleW = GROUND_IMG.width * (scaleH/GROUND_IMG.height);
  let offset = -(scrollX % scaleW);
  ctx.save();
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, groundY, CW, gh);
  for(let x = offset; x < CW; x += scaleW){
    ctx.drawImage(GROUND_IMG, x, groundY, scaleW, scaleH);
  }
  ctx.strokeStyle="#111"; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(0,groundY); ctx.lineTo(CW,groundY); ctx.stroke();
  ctx.restore();
}

function drawPlayer(){
  const img = equippedSkin.walk;
  if(!img.complete || img.naturalWidth===0) return;
  const iw = img.width, ih = img.height;
  const scale = player.h/ih;
  const dw = iw*scale, dh = ih*scale;
  const dx = player.x - (dw-player.w)/2;
  let dy = player.y - (dh-player.h);
  // running bob (only while on ground)
  let tilt = 0;
  if(state==="playing"){
    if(player.onGround){
      dy += Math.sin(player.bob*10)*3;
      tilt = Math.sin(player.bob*10)*0.03;
    } else {
      tilt = -0.12;
    }
  }
  ctx.save();
  ctx.translate(dx+dw/2, dy+dh/2);
  ctx.rotate(tilt);
  ctx.drawImage(img, -dw/2, -dh/2, dw, dh);
  ctx.restore();
}

function drawObstacles(){
  for(const o of obstacles){
    if(!o.img.complete) continue;
    ctx.drawImage(o.img, o.x, o.y, o.w, o.h);
  }
}

function drawCoins(){
  for(const c of coins){
    if(c.collected) continue;
    const spin = Math.abs(Math.sin(performance.now()/260 + c.phase));
    const sx = Math.max(0.18, spin);
    const size = c.r*2;
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.scale(sx,1);
    ctx.drawImage(COIN_IMG, -size/2, -size/2, size, size);
    ctx.restore();
  }
}

function drawBackgroundDecor(){
  // simple faint horizon line, kept minimal per pixel-art aesthetic
}

function render(){
  ctx.clearRect(0,0,CW,CH);
  drawBackgroundDecor();
  drawGround();
  if(state==="playing" || state==="gameover"){
    drawCoins();
    drawObstacles();
    drawPlayer();
  }
}

/* ---------- init ---------- */
resetPlayer();
requestAnimationFrame(frame);
goToMenu();

})();
</script>
